<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#F0ABFC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="check1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="check2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
    <filter id="tinyShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#glow1)"/>
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#glow2)"/>

  <!-- Floating glass card (tilted) -->
  <g transform="rotate(-6 256 264)" filter="url(#softShadow)">
    <rect x="120" y="96" width="272" height="336" rx="36" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- Straight foreground card -->
  <g filter="url(#softShadow)">
    <rect x="132" y="108" width="248" height="312" rx="32" fill="#FFFFFF"/>
  </g>

  <!-- Top tab -->
  <rect x="212" y="86" width="88" height="40" rx="14" fill="#4C1D95"/>
  <rect x="228" y="97" width="56" height="18" rx="9" fill="#C4B5FD"/>

  <!-- Checklist row 1 (done, green gradient bubble) -->
  <circle cx="184" cy="188" r="22" fill="url(#check1)" filter="url(#tinyShadow)"/>
  <path d="M174 188 L182 197 L196 178" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="224" y="178" width="130" height="18" rx="9" fill="#E2E8F0"/>

  <!-- Checklist row 2 (done, amber gradient bubble) -->
  <circle cx="184" cy="254" r="22" fill="url(#check2)" filter="url(#tinyShadow)"/>
  <path d="M174 254 L182 263 L196 244" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="224" y="244" width="104" height="18" rx="9" fill="#E2E8F0"/>

  <!-- Checklist row 3 (active, glowing ring) -->
  <circle cx="184" cy="320" r="22" fill="#EEF2FF" stroke="#6366F1" stroke-width="6"/>
  <circle cx="184" cy="320" r="8" fill="#6366F1"/>
  <rect x="224" y="310" width="140" height="18" rx="9" fill="#EEF2FF"/>

  <!-- Checklist row 4 (pending, dashed) -->
  <circle cx="184" cy="386" r="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="5" stroke-dasharray="6 7"/>
  <rect x="224" y="376" width="112" height="18" rx="9" fill="#F1F5F9"/>

  <!-- Sparkle accents -->
  <path d="M420 96 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 Z" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="92" cy="420" r="8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="440" cy="360" r="6" fill="#FFFFFF" opacity="0.6"/>
</svg>
